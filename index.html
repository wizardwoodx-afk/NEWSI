<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SelfImpulse — an on-device AI captain that governs, executes, verifies and receipts every action. Built on the MJ engine." />
    <meta name="theme-color" content="#0A0C0E" />
    <title>SelfImpulse — Agentic impulse for remaining</title>
    <link rel="icon" href="/brand/si-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/si-mark-128.png" />
    <script>
      // Boot: surface errors early. No splash — the app paints directly.
      (function(){
        /* Resolve the theme before any stylesheet paints. vh.css carries its
         * colour tokens only under [data-theme=dark] / [data-theme=light], so
         * with no attribute set `color:var(--fg)` is invalid-at-computed-value
         * (black) while the inline background below forces the dark ground —
         * black text on a dark ground for the whole first frame. */
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem("vh.theme.v2") === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
        window.addEventListener('error', function(e){ console.error('[11h]', e.message); });
        window.addEventListener('unhandledrejection', function(e){ console.error('[11h]', e.reason); });
      })();
    </script>
    <!-- CRITICAL GROUND. This block is the only paint that happens before the
         stylesheet loads, and its selectors (html[data-theme=light] body)
         outrank vh.css's `body{...}`, so if the two disagree the app shows the
         wrong ground for as long as this rule wins — which, being inline, is
         forever. They drifted once already: this said #0D1010 / #FAEBD7 while
         the sheet said something else entirely. verify/suites/theme.test.mjs
         now asserts they match, so they cannot separate again.

         SLATE REVISION — both values moved here, and they moved TOGETHER.
         The dark ground is now a shade of black (#0A0C0E) rather than true
         #000000, and the light ground is stone (#E6E5DD) rather than #F7F7F5.
         vh.css and src/ui/si/si.css were changed to the same two values in the
         same commit, which is the only way this block may ever change: it wins
         over both sheets for the whole first frame, so a value that disagrees
         with them is a visible flash that never corrects itself. -->
    
    <style>html,body{margin:0;padding:0;background:#0A0C0E}html[data-theme="light"],html[data-theme="light"] body{background:#E6E5DD}#root{min-height:100vh}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
